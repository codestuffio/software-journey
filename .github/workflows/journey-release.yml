name: Release walkthrough

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag, such as v2.0.0
        required: true
        type: string
      approval:
        description: Reviewed approval digest (leave blank to prepare a preview)
        required: false
        type: string
      verify_identity:
        description: Check Anthropic federation without generating or publishing
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: journey-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  JOURNEY_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  JOURNEY_RELEASE_TYPES: ${{ vars.JOURNEY_RELEASE_TYPES }}
  JOURNEY_RELEASE_INCLUDE: ${{ vars.JOURNEY_RELEASE_INCLUDE }}
  JOURNEY_RELEASE_EXCLUDE: ${{ vars.JOURNEY_RELEASE_EXCLUDE }}
  JOURNEY_SEED_RELEASE: ${{ vars.JOURNEY_SEED_RELEASE }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    if: >-
      github.event_name == 'release' ||
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.approval && !inputs.verify_identity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - &node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - &pnpm
        uses: pnpm/action-setup@v6
      - &install
        run: pnpm install --frozen-lockfile
      - &build
        run: pnpm build --filter=@software-journey/cli
      - name: Prepare walkthrough approval
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/journey-release.sh
      - name: Upload exact request for review
        if: steps.prepare.outputs.preview == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-approval
          path: ${{ runner.temp }}/journey-release/approval.json
          if-no-files-found: error
          retention-days: 1

  generate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (inputs.approval || inputs.verify_identity)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      ready: ${{ steps.generate.outputs.ready }}
      revision: ${{ steps.generate.outputs.revision }}
      release-id: ${{ steps.generate.outputs.release-id }}
    env:
      ANTHROPIC_AUTH_MODE: github-wif
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *build
      - name: Verify Anthropic workload identity
        if: inputs.verify_identity
        run: node apps/cli/dist/index.js release-walkthrough check-identity | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Generate approved chapters
        id: generate
        if: inputs.approval && !inputs.verify_identity
        env:
          GH_TOKEN: ${{ github.token }}
          JOURNEY_APPROVAL: ${{ inputs.approval }}
        run: bash .github/scripts/journey-release.sh
      - name: Upload complete walkthrough for publication
        if: steps.generate.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: approved-walkthrough
          path: ${{ runner.temp }}/journey-release/software-journey.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-walkthrough
      - name: Attach the walkthrough to the approved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.generate.outputs.revision }}
          RELEASE_ID: ${{ needs.generate.outputs.release-id }}
        run: |
          set -euo pipefail
          tag=$(jq -nr --arg tag "$RELEASE_TAG" '$tag | @uri')
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          test "$(jq -r '.id' <<< "$release")" = "$RELEASE_ID"
          test "$(jq -r '.draft or (.immutable == true)' <<< "$release")" = false
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object')
          for _ in {1..8}; do
            [[ $(jq -r '.type' <<< "$object") == tag ]] || break
            sha=$(jq -r '.sha' <<< "$object")
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object')
          done
          test "$(jq -r '.type + ":" + .sha' <<< "$object")" = "commit:$RELEASE_SHA"
          gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" software-journey.md
